<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NubiTube MAP</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#07182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0 0 7px;
  font-size:30px;
}

.header p{
  margin:0;
  color:#9fb6cd;
}

.search{
  width:100%;
  padding:14px 16px;
  margin-bottom:12px;
  border:1px solid #17618a;
  border-radius:12px;
  outline:none;
  background:#091c35;
  color:#fff;
  font-size:15px;
}

.search::placeholder{
  color:#8196ae;
}

.breadcrumb{
  margin:0 0 12px 3px;
  color:#8faac5;
  font-size:13px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(260px,.65fr);
  gap:15px;
}

.mapbox{
  position:relative;
  min-height:650px;
  overflow:hidden;
  border:1px solid #17618a;
  border-radius:18px;
  background:
    radial-gradient(circle at 50% 40%,#12365e 0%,#091c35 55%,#07182e 100%);
}

svg{
  display:block;
  width:100%;
  height:650px;
}

.province{
  fill:#15547c;
  stroke:#9bd9f3;
  stroke-width:.7;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:fill .15s ease,stroke .15s ease,opacity .15s ease;
}

.province:hover{
  fill:#00a9dc;
  stroke:#fff;
  stroke-width:1.5;
}

.province.selected{
  fill:#00c9ff;
  stroke:#fff;
  stroke-width:2;
}

.province.dimmed{
  opacity:.18;
}

.panel{
  padding:22px;
  border:1px solid #17618a;
  border-radius:18px;
  background:#091c35;
}

.panel h2{
  margin:0 0 10px;
  font-size:25px;
}

.panel p{
  margin:0;
  color:#a9bdd2;
  line-height:1.55;
}

.tag{
  display:inline-block;
  margin-top:18px;
  padding:6px 10px;
  border:1px solid #00c9ff;
  border-radius:20px;
  color:#00d8ff;
  font-size:11px;
  font-weight:bold;
}

.loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#091c35;
  color:#b8cadd;
  text-align:center;
}

.loading.hidden{
  display:none;
}

.error{
  color:#ffb5b5;
}

@media(max-width:760px){

  #app{
    padding:12px;
  }

  .header h1{
    font-size:25px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .mapbox{
    min-height:500px;
  }

  svg{
    height:500px;
  }

  .panel{
    min-height:170px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <h1>📍 NubiTube MAP</h1>
    <p>Mapa interactivo de medios de Argentina</p>
  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Buscar provincia..."
    autocomplete="off"
  >

  <div class="breadcrumb">
    🇦🇷 Argentina
  </div>

  <div class="layout">

    <div class="mapbox">

      <div id="loading" class="loading">
        Cargando cartografía de Argentina...
      </div>

      <svg
        id="map"
        viewBox="0 0 800 900"
        preserveAspectRatio="xMidYMid meet"
        aria-label="Mapa interactivo de Argentina">
      </svg>

    </div>

    <aside class="panel">

      <h2 id="title">
        🇦🇷 Argentina
      </h2>

      <p id="info">
        Seleccioná una provincia en el mapa para explorar sus medios.
      </p>

      <span id="tag" class="tag">
        24 jurisdicciones
      </span>

    </aside>

  </div>

</div>

<script>
(function(){

"use strict";

const DATA_URL="./data/argentina.geojson";

const svg=document.getElementById("map");
const loading=document.getElementById("loading");
const title=document.getElementById("title");
const info=document.getElementById("info");
const tag=document.getElementById("tag");
const search=document.getElementById("search");

let provinceElements=[];


/* NORMALIZAR TEXTO */

function normalizeText(text){

  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

}


/* CONVERTIR GEOMETRÍA A ANILLOS */

function getRings(geometry){

  if(!geometry){
    return [];
  }

  if(geometry.type==="Polygon"){
    return geometry.coordinates;
  }

  if(geometry.type==="MultiPolygon"){

    return geometry.coordinates.reduce(
      function(all,polygon){
        return all.concat(polygon);
      },
      []
    );

  }

  return [];

}


/* OBTENER TODOS LOS PUNTOS */

function getPoints(features){

  const points=[];

  features.forEach(function(feature){

    getRings(feature.geometry).forEach(function(ring){

      ring.forEach(function(point){

        points.push(point);

      });

    });

  });

  return points;

}


/* CREAR PROYECCIÓN */

function createProjection(features){

  const points=getPoints(features);

  if(!points.length){
    throw new Error("El archivo no contiene geometrías.");
  }

  const xs=points.map(p=>p[0]);
  const ys=points.map(p=>p[1]);

  const minX=Math.min.apply(null,xs);
  const maxX=Math.max.apply(null,xs);
  const minY=Math.min.apply(null,ys);
  const maxY=Math.max.apply(null,ys);

  const W=800;
  const H=900;
  const PAD=28;

  const scaleX=(W-PAD*2)/(maxX-minX);
  const scaleY=(H-PAD*2)/(maxY-minY);

  const scale=Math.min(scaleX,scaleY);

  const usedW=(maxX-minX)*scale;
  const usedH=(maxY-minY)*scale;

  const offsetX=(W-usedW)/2;
  const offsetY=(H-usedH)/2;

  return {

    x:function(lon){
      return offsetX+(lon-minX)*scale;
    },

    y:function(lat){
      return H-(offsetY+(lat-minY)*scale);
    }

  };

}


/* CREAR PATH SVG */

function geometryToPath(geometry,project){

  return getRings(geometry)

    .map(function(ring){

      return ring.map(function(point,index){

        const x=project.x(point[0]).toFixed(2);
        const y=project.y(point[1]).toFixed(2);

        return (index===0 ? "M" : "L")+x+","+y;

      }).join("")+"Z";

    })

    .join("");

}


/* DIBUJAR ARGENTINA */

function draw(data){

  if(
    !data ||
    data.type!=="FeatureCollection" ||
    !Array.isArray(data.features) ||
    !data.features.length
  ){
    throw new Error("GeoJSON inválido.");
  }

  svg.innerHTML="";
  provinceElements=[];

  const project=createProjection(data.features);

  data.features.forEach(function(feature){

    const properties=feature.properties || {};

    const name=
      properties.nombre ||
      properties.name ||
      "Provincia";

    const path=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    path.setAttribute(
      "d",
      geometryToPath(feature.geometry,project)
    );

    path.setAttribute(
      "class",
      "province"
    );

    path.dataset.name=name;
    path.dataset.search=normalizeText(name);

    const tooltip=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "title"
    );

    tooltip.textContent=name;

    path.appendChild(tooltip);


    path.addEventListener("click",function(){

      provinceElements.forEach(function(item){
        item.classList.remove("selected");
      });

      path.classList.add("selected");

      title.textContent=name;

      info.textContent=
        "Provincia seleccionada. En la próxima etapa NubiTube MAP abrirá sus departamentos, localidades y medios disponibles.";

      tag.textContent="Provincia seleccionada";

    });


    svg.appendChild(path);

    provinceElements.push(path);

  });

  tag.textContent=
    data.features.length+" jurisdicciones";

  loading.classList.add("hidden");

}


/* BUSCADOR */

search.addEventListener("input",function(){

  const query=normalizeText(search.value);

  provinceElements.forEach(function(path){

    path.classList.remove("selected","dimmed");

  });

  if(!query){

    title.textContent="🇦🇷 Argentina";

    info.textContent=
      "Seleccioná una provincia en el mapa para explorar sus medios.";

    tag.textContent=
      provinceElements.length+" jurisdicciones";

    return;
  }


  const matches=provinceElements.filter(function(path){

    return path.dataset.search.indexOf(query)!==-1;

  });


  provinceElements.forEach(function(path){

    if(matches.indexOf(path)===-1){
      path.classList.add("dimmed");
    }

  });


  if(matches.length===1){

    matches[0].classList.add("selected");

    const name=matches[0].dataset.name;

    title.textContent=name;

    info.textContent=
      "Provincia encontrada. Hacé clic sobre ella para seleccionarla.";

    tag.textContent="Resultado encontrado";

  }else{

    title.textContent="Resultados";

    info.textContent=
      matches.length+
      " provincias coinciden con la búsqueda.";

    tag.textContent=
      matches.length+" coincidencias";

  }

});


/* CARGAR ARCHIVO LOCAL DE GITHUB */

fetch(DATA_URL,{
  cache:"no-store"
})

.then(function(response){

  if(!response.ok){

    throw new Error(
      "HTTP "+response.status
    );

  }

  return response.json();

})

.then(function(data){

  draw(data);

})

.catch(function(error){

  console.error(
    "NubiTube MAP:",
    error
  );

  loading.innerHTML=
    '<span class="error">'+
    'No se pudo cargar la cartografía.<br>'+
    'Error: '+error.message+
    '</span>';

});

})();
</script>

</body>
</html>
