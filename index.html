<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NubiTube MAP</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#07182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0 0 7px;
  font-size:30px;
}

.header p{
  margin:0;
  color:#9fb6cd;
}

.search{
  width:100%;
  padding:14px 16px;
  margin-bottom:12px;
  border:1px solid #17618a;
  border-radius:12px;
  outline:none;
  background:#091c35;
  color:#fff;
  font-size:15px;
}

.search::placeholder{
  color:#8196ae;
}

.search-wrap{
  position:relative;
  z-index:30;
}

.search-results{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:calc(100% - 7px);
  max-height:360px;
  overflow:auto;
  border:1px solid #17618a;
  border-radius:0 0 12px 12px;
  background:#091c35;
  box-shadow:0 12px 30px rgba(0,0,0,.28);
}

.search-results.visible{
  display:block;
}

.search-result{
  display:block;
  width:100%;
  padding:11px 14px;
  border:0;
  border-bottom:1px solid #163b5b;
  background:#091c35;
  color:#d9efff;
  text-align:left;
  cursor:pointer;
}

.search-result:last-child{
  border-bottom:0;
}

.search-result:hover,
.search-result:focus{
  background:#103153;
  color:#fff;
  outline:none;
}

.search-result small{
  display:block;
  margin-top:3px;
  color:#8faac5;
  font-size:11px;
}

.search-empty{
  padding:12px 14px;
  color:#8faac5;
  font-size:13px;
}

.navbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  min-height:38px;
  margin:0 0 10px 3px;
}

.back{
  display:none;
  padding:7px 11px;
  border:1px solid #17618a;
  border-radius:8px;
  background:#091c35;
  color:#9bd9f3;
  cursor:pointer;
  font-size:13px;
}

.back.visible{
  display:inline-block;
}

.back:hover{
  border-color:#00c9ff;
  color:#fff;
}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  color:#8faac5;
  font-size:13px;
}

.crumb-btn{
  border:0;
  padding:0;
  background:none;
  color:#8fdcff;
  cursor:pointer;
  font:inherit;
}

.crumb-btn:hover{
  color:#fff;
  text-decoration:underline;
}

.crumb-current{
  color:#c6d7e7;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(260px,.65fr);
  gap:15px;
}

.mapbox{
  position:relative;
  min-height:650px;
  overflow:hidden;
  border:1px solid #17618a;
  border-radius:18px;
  background:
    radial-gradient(
      circle at 50% 40%,
      #12365e 0%,
      #091c35 55%,
      #07182e 100%
    );
}

svg{
  display:block;
  width:100%;
  height:650px;
}

.region{
  fill:#15547c;
  stroke:#9bd9f3;
  stroke-width:.7;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:
    fill .15s,
    stroke .15s,
    opacity .15s;
}

.region:hover{
  fill:#00a9dc;
  stroke:#fff;
  stroke-width:1.5;
}

.region.selected{
  fill:#00c9ff;
  stroke:#fff;
  stroke-width:2;
}

.region.dimmed,
.locality.dimmed{
  opacity:.12;
}

.locality{
  fill:#00d8ff;
  stroke:#fff;
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:
    opacity .15s,
    fill .15s,
    stroke .15s;
}

.locality:hover,
.locality.selected{
  fill:#fff;
  stroke:#00d8ff;
  stroke-width:2.5;
}

.panel{
  padding:22px;
  border:1px solid #17618a;
  border-radius:18px;
  background:#091c35;
}

.panel h2{
  margin:0 0 10px;
  font-size:25px;
}

.panel p{
  margin:0;
  color:#a9bdd2;
  line-height:1.55;
}

.context{
  margin-top:18px !important;
  color:#fff !important;
  font-weight:bold;
}

.tag{
  display:inline-block;
  margin-top:18px;
  padding:6px 10px;
  border:1px solid #00c9ff;
  border-radius:20px;
  color:#00d8ff;
  font-size:11px;
  font-weight:bold;
}

.locality-list{
  display:none;
  margin-top:18px;
  border-top:1px solid #163b5b;
  padding-top:14px;
}

.locality-list.visible{
  display:block;
}

.locality-item{
  display:block;
  width:100%;
  margin:0 0 7px;
  padding:9px 11px;
  border:1px solid #174c70;
  border-radius:9px;
  background:#0b2340;
  color:#d9efff;
  text-align:left;
  cursor:pointer;
}

.locality-item:hover,
.locality-item.selected{
  border-color:#00c9ff;
  color:#fff;
  background:#103153;
}

.media-list{
  display:none;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid #163b5b;
}

.media-list.visible{
  display:block;
}

.media-heading{
  margin:0 0 10px;
  color:#fff;
  font-size:14px;
  font-weight:bold;
}

.media-item{
  display:block;
  width:100%;
  margin:0 0 8px;
  padding:11px 12px;
  border:1px solid #174c70;
  border-radius:9px;
  background:#0b2340;
  color:#d9efff;
  text-decoration:none;
  line-height:1.35;
}

.media-item:hover{
  border-color:#00c9ff;
  background:#103153;
  color:#fff;
}

.media-item small{
  display:block;
  margin-top:4px;
  color:#8faac5;
  font-size:11px;
}

.loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#091c35;
  color:#b8cadd;
  text-align:center;
}

.loading.hidden{
  display:none;
}

.error{
  color:#ffb5b5;
}

@media(max-width:760px){

  #app{
    padding:10px;
  }

  .header{
    margin-bottom:12px;
  }

  .header h1{
    font-size:24px;
    margin-bottom:5px;
  }

  .header p{
    font-size:13px;
    line-height:1.35;
    padding:0 6px;
  }

  .search{
    margin-bottom:9px;
    padding:13px 14px;
    border-radius:10px;
    font-size:16px;
  }

  .navbar{
    min-height:0;
    margin:0 0 9px 1px;
    gap:6px;
    align-items:flex-start;
    flex-direction:column;
  }

  .back{
    min-height:40px;
    padding:9px 12px;
    font-size:13px;
  }

  .breadcrumb{
    width:100%;
    gap:5px;
    font-size:12px;
    line-height:1.45;
  }

  .crumb-btn{
    min-height:30px;
  }

  .layout{
    grid-template-columns:1fr;
    gap:10px;
  }

  .mapbox{
    min-height:430px;
    border-radius:14px;
  }

  svg{
    height:430px;
  }

  .panel{
    min-height:0;
    padding:17px;
    border-radius:14px;
  }

  .panel h2{
    font-size:22px;
    margin-bottom:8px;
  }

  .panel p{
    font-size:14px;
    line-height:1.45;
  }

  .context{
    margin-top:13px !important;
  }

  .tag{
    margin-top:13px;
  }

  .locality-list{
    margin-top:14px;
    padding-top:12px;
  }

  .locality-item{
    min-height:44px;
    margin-bottom:7px;
    padding:11px 12px;
    font-size:14px;
  }
}

@media(max-width:420px){

  #app{
    padding:8px;
  }

  .header h1{
    font-size:22px;
  }

  .header p{
    font-size:12px;
  }

  .mapbox{
    min-height:390px;
  }

  svg{
    height:390px;
  }

  .panel{
    padding:15px;
  }

  .panel h2{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <h1>📍 NubiTube MAP</h1>
    <p>Mapa interactivo de radios y canales de TV de Argentina</p>
  </div>

  <div class="search-wrap">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Buscar Radio, TV o Lugar..."
      autocomplete="off"
      aria-autocomplete="list"
      aria-controls="searchResults">
    <div
      id="searchResults"
      class="search-results"
      role="listbox">
    </div>
  </div>

  <div class="navbar">

    <button
      id="back"
      class="back"
      type="button">
      ← Volver
    </button>

    <div
      id="breadcrumb"
      class="breadcrumb">
    </div>

  </div>

  <div class="layout">

    <div class="mapbox">

      <div
        id="loading"
        class="loading">
        Cargando cartografía...
      </div>

      <svg
        id="map"
        viewBox="0 0 800 900"
        preserveAspectRatio="xMidYMid meet"
        aria-label="Mapa interactivo de Argentina">
      </svg>

    </div>

    <aside class="panel">

      <h2 id="title">
        🇦🇷 Argentina
      </h2>

      <p id="info">
        Seleccioná una provincia para explorar sus departamentos y medios.
      </p>

      <p
        id="context"
        class="context">
        Explorá radios y canales de TV de Argentina
      </p>

      <span
        id="tag"
        class="tag">
        Seleccioná una provincia
      </span>

      <div
        id="mediaList"
        class="media-list">
      </div>

      <div
        id="localityList"
        class="locality-list">
      </div>

    </aside>

  </div>

</div>

<script>
(function(){

"use strict";

/* =========================
   ARCHIVOS
========================= */

const PROVINCIAS_URL=
  "./data/argentina.geojson";

const DEPARTAMENTOS_URL=
  "./data/departamentos.geojson";

const LOCALIDADES_URL=
  "./data/localidad_bahra.geojson";

const PARAJES_URL=
  "./data/bahra_paraje.geojson";

const BLOGGER_BASE="https://www.nubitube.com";
const BLOGGER_PAGE_SIZE=50;
const BLOGGER_MAX_PAGES=20;
const BLOGGER_TIMEOUT=10000;


/* =========================
   ELEMENTOS
========================= */

const svg=
  document.getElementById("map");

const loading=
  document.getElementById("loading");

const title=
  document.getElementById("title");

const info=
  document.getElementById("info");

const context=
  document.getElementById("context");

const tag=
  document.getElementById("tag");

const search=
  document.getElementById("search");

const searchResults=
  document.getElementById("searchResults");

const breadcrumb=
  document.getElementById("breadcrumb");

const back=
  document.getElementById("back");

const localityList=
  document.getElementById("localityList");


const mediaList=
  document.getElementById("mediaList");


/* =========================
   ESTADO
========================= */

let provincias=null;
let departamentos=null;
let localidades=null;
let parajes=null;

let currentLevel="country";

let currentProvince=null;
let currentDepartment=null;

let regionElements=[];
let localityElements=[];

let searchIndex=[];
let searchTimer=null;

let mediaCatalog=[];
let mediaLoadReport=null;


/* =========================
   NORMALIZACIÓN
========================= */

function normalizeText(text){

  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

}


/* =========================
   PROPIEDADES
========================= */

function prop(feature,names){

  const p=
    (feature && feature.properties) || {};

  for(const name of names){

    if(
      p[name]!==undefined &&
      p[name]!==null &&
      String(p[name]).trim()!==""
    ){
      return p[name];
    }

  }

  return "";

}


function featureName(feature){

  return String(

    prop(feature,[

      "nombre",
      "nam",

      /* BAHRA */
      "fna",
      "nom_agl",
      "nom_aglo",

      "nombre_localidad",
      "localidad",
      "name"

    ]) || "Sin nombre"

  );

}


/* =========================
   GEOMETRÍAS
========================= */

function rawRings(geometry){

  if(!geometry){
    return [];
  }

  if(geometry.type==="Polygon"){
    return geometry.coordinates;
  }

  if(geometry.type==="MultiPolygon"){

    return geometry.coordinates.reduce(
      function(all,polygon){
        return all.concat(polygon);
      },
      []
    );

  }

  return [];

}


/*
  Encuadre NubiTube MAP:
  Argentina continental +
  Tierra del Fuego +
  islas próximas.

  No altera el archivo original.
*/

function ringVisible(ring){

  if(!ring || !ring.length){
    return false;
  }

  let lon=0;
  let lat=0;

  ring.forEach(function(point){

    lon+=point[0];
    lat+=point[1];

  });

  lon/=ring.length;
  lat/=ring.length;

  return (
    lon>=-76 &&
    lon<=-52 &&
    lat>=-57
  );

}


function displayRings(geometry){

  return rawRings(geometry)
    .filter(ringVisible);

}


/* =========================
   PROYECCIÓN
========================= */

function createProjection(features){

  const points=[];

  features.forEach(function(feature){

    displayRings(feature.geometry)
      .forEach(function(ring){

        ring.forEach(function(point){

          points.push(point);

        });

      });

  });


  if(!points.length){

    throw new Error(
      "No se encontraron geometrías visibles."
    );

  }


  const xs=
    points.map(function(p){
      return p[0];
    });

  const ys=
    points.map(function(p){
      return p[1];
    });


  const minX=Math.min.apply(null,xs);
  const maxX=Math.max.apply(null,xs);

  const minY=Math.min.apply(null,ys);
  const maxY=Math.max.apply(null,ys);


  const W=800;
  const H=900;
  const PAD=35;


  const scale=Math.min(

    (W-PAD*2)/(maxX-minX),

    (H-PAD*2)/(maxY-minY)

  );


  const usedW=
    (maxX-minX)*scale;

  const usedH=
    (maxY-minY)*scale;


  const offsetX=
    (W-usedW)/2;

  const offsetY=
    (H-usedH)/2;


  return {

    x:function(lon){

      return offsetX+
        (lon-minX)*scale;

    },

    y:function(lat){

      return H-
        (
          offsetY+
          (lat-minY)*scale
        );

    }

  };

}


/* =========================
   SVG PATH
========================= */

function geometryToPath(
  geometry,
  project
){

  return displayRings(geometry)

    .map(function(ring){

      return ring

        .map(function(point,index){

          const x=
            project.x(point[0])
              .toFixed(2);

          const y=
            project.y(point[1])
              .toFixed(2);

          return (
            index===0
              ? "M"
              : "L"
          )+
          x+
          ","+
          y;

        })

        .join("")+
        "Z";

    })

    .join("");

}


/* =========================
   BREADCRUMB
========================= */

function renderBreadcrumb(){

  breadcrumb.innerHTML="";


  if(currentLevel==="country"){

    const current=
      document.createElement("span");

    current.className=
      "crumb-current";

    current.textContent=
      "🇦🇷 Argentina";

    breadcrumb.appendChild(current);

    return;

  }


  const argentina=
    document.createElement("button");

  argentina.className=
    "crumb-btn";

  argentina.textContent=
    "🇦🇷 Argentina";

  argentina.addEventListener(
    "click",
    showArgentina
  );

  breadcrumb.appendChild(
    argentina
  );


  const sep1=
    document.createElement("span");

  sep1.textContent="›";

  breadcrumb.appendChild(sep1);


  if(currentLevel==="province"){

    const current=
      document.createElement("span");

    current.className=
      "crumb-current";

    current.textContent=
      currentProvince.name;

    breadcrumb.appendChild(
      current
    );

    return;

  }


  const provinceButton=
    document.createElement("button");

  provinceButton.className=
    "crumb-btn";

  provinceButton.textContent=
    currentProvince.name;

  provinceButton.addEventListener(
    "click",
    function(){

      showProvince(
        currentProvince.feature
      );

    }
  );

  breadcrumb.appendChild(
    provinceButton
  );


  const sep2=
    document.createElement("span");

  sep2.textContent="›";

  breadcrumb.appendChild(sep2);


  const current=
    document.createElement("span");

  current.className=
    "crumb-current";

  current.textContent=
    currentDepartment.name;

  breadcrumb.appendChild(
    current
  );

}


/* =========================
   BOTÓN VOLVER
========================= */

function updateBackButton(){

  if(currentLevel==="country"){

    back.classList.remove(
      "visible"
    );

    return;

  }


  back.classList.add(
    "visible"
  );


  if(currentLevel==="province"){

    back.textContent=
      "← Volver a Argentina";

  }

  else if(
    currentLevel==="department"
  ){

    back.textContent=
      "← Volver a "+
      currentProvince.name;

  }

}


back.addEventListener(
  "click",
  function(){

    if(currentLevel==="province"){

      showArgentina();

      return;

    }


    if(currentLevel==="department"){

      showProvince(
        currentProvince.feature
      );

    }

  }
);


/* =========================
   DIBUJAR POLÍGONOS
========================= */

function drawFeatures(
  features,
  onClick
){

  svg.innerHTML="";

  regionElements=[];
  localityElements=[];


  const visible=
    features.filter(function(feature){

      return (
        displayRings(
          feature.geometry
        ).length>0
      );

    });


  const project=
    createProjection(visible);


  visible.forEach(function(feature){

    const name=
      featureName(feature);


    const d=
      geometryToPath(
        feature.geometry,
        project
      );


    if(!d){
      return;
    }


    const path=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    path.setAttribute(
      "d",
      d
    );

    path.setAttribute(
      "class",
      "region"
    );


    path.dataset.name=
      name;

    path.dataset.search=
      normalizeText(name);


    const tooltip=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "title"
      );

    tooltip.textContent=
      name;

    path.appendChild(
      tooltip
    );


    path.addEventListener(
      "click",
      function(){

        onClick(
          feature,
          path,
          project
        );

      }
    );


    svg.appendChild(
      path
    );

    regionElements.push(
      path
    );

  });


  return project;

}


/* =========================
   MEDIOS · FILTROS Y UI
========================= */

function mediaCounts(items){
  return {
    total:items.length,
    radios:items.filter(function(m){return m.type==="radio";}).length,
    tv:items.filter(function(m){return m.type==="tv";}).length
  };
}

function mediaForProvinceFeature(feature){
  const id=provinceIdOf(feature);
  return mediaCatalog.filter(function(m){
    return m.territory.province &&
      provinceIdOf(m.territory.province)===id;
  });
}

function mediaForDepartmentFeature(feature){
  const id=departmentIdOf(feature);
  return mediaCatalog.filter(function(m){
    return m.territory.department &&
      departmentIdOf(m.territory.department)===id;
  });
}

function mediaForPlaceFeature(feature,departmentFeature){
  const place=normalizeText(featureName(feature));
  const depId=departmentFeature
    ? departmentIdOf(departmentFeature)
    : "";
  return mediaCatalog.filter(function(m){
    if(!m.territory.place){return false;}
    return normalizeText(m.territory.placeName)===place &&
      (!depId ||
       (m.territory.department &&
        departmentIdOf(m.territory.department)===depId));
  });
}

function setMediaContext(items,label){
  const c=mediaCounts(items);
  context.textContent=
    "Explorá "+c.total+
    " radios y canales de TV de "+label+
    (c.total
      ? " · 📻 "+c.radios+" · 📺 "+c.tv
      : "");
}

function clearMediaList(){
  mediaList.innerHTML="";
  mediaList.classList.remove("visible");
}

function renderMediaList(items,label){
  clearMediaList();
  if(!items.length){return;}

  const heading=document.createElement("div");
  heading.className="media-heading";
  const c=mediaCounts(items);
  heading.textContent=
    "Medios en "+label+" · 📻 "+c.radios+" · 📺 "+c.tv;
  mediaList.appendChild(heading);

  items.slice()
    .sort(function(a,b){
      if(a.type!==b.type){return a.type.localeCompare(b.type);}
      return a.title.localeCompare(b.title,"es");
    })
    .forEach(function(m){
      const a=document.createElement("a");
      a.className="media-item";
      a.href=m.url;
      a.target="_blank";
      a.rel="noopener";
      a.textContent=m.icon+" "+m.title;

      const small=document.createElement("small");
      small.textContent=
        (m.territory.placeName ? m.territory.placeName+" · " : "")+
        (m.territory.departmentName ? m.territory.departmentName+" · " : "")+
        (m.territory.provinceName || "");
      a.appendChild(small);
      mediaList.appendChild(a);
    });

  mediaList.classList.add("visible");
}

function refreshVisibleMedia(){
  if(!mediaCatalog.length){return;}

  if(currentLevel==="country"){
    setMediaContext(mediaCatalog,"Argentina");
    clearMediaList();
    return;
  }

    const items=
      mediaForProvinceFeature(currentProvince.feature);

    const items=
      mediaForDepartmentFeature(currentDepartment.feature);
    setMediaContext(items,currentDepartment.name);
    renderMediaList(items,currentDepartment.name);
  }
}

/* =========================
   LUGARES BAHRA
========================= */

function departmentPlaces(
  departmentFeature
){

  const depId=
    String(
      prop(
        departmentFeature,
        ["id","in1"]
      )
    ).trim();

  const provinceId=
    String(
      currentProvince.id
    ).trim();

  function belongsToDepartment(feature){

    const p=
      feature.properties || {};

    const placeDepartment=
      String(p.cod_depto || "").trim();

    const placeProvince=
      String(p.cod_pcia || "").trim();

    return (
      placeDepartment===depId &&
      (
        !placeProvince ||
        placeProvince===provinceId
      )
    );
  }

  const localities=
    ((localidades && localidades.features) || [])
      .filter(belongsToDepartment);

  const hamlets=
    ((parajes && parajes.features) || [])
      .filter(belongsToDepartment);

  const merged=
    localities.concat(hamlets);

  const seen=
    new Set();

  return merged.filter(function(feature){

    const name=
      normalizeText(featureName(feature));

    const coords=
      (
        feature.geometry &&
        feature.geometry.type==="Point" &&
        Array.isArray(feature.geometry.coordinates)
      )
      ? feature.geometry.coordinates
      : [];

    const lon=
      coords.length>=2
        ? Number(coords[0]).toFixed(4)
        : "";

    const lat=
      coords.length>=2
        ? Number(coords[1]).toFixed(4)
        : "";

    const key=
      depId+"|"+name+"|"+lon+"|"+lat;

    if(seen.has(key)){
      return false;
    }

    seen.add(key);
    return true;
  });
}

/* =========================
   PUNTOS DE LUGARES
========================= */

function drawLocalities(
  features,
  project
){

  localityElements=[];


  features.forEach(
    function(feature){

      if(
        !feature.geometry ||
        feature.geometry.type!=="Point"
      ){
        return;
      }


      const coords=
        feature.geometry.coordinates;


      if(
        !Array.isArray(coords) ||
        coords.length<2
      ){
        return;
      }


      const name=
        featureName(feature);


      const circle=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );


      circle.setAttribute(
        "cx",
        project.x(coords[0])
      );


      circle.setAttribute(
        "cy",
        project.y(coords[1])
      );


      circle.setAttribute(
        "r",
        "7"
      );


      circle.setAttribute(
        "class",
        "locality"
      );


      circle.dataset.name=
        name;


      circle.dataset.search=
        normalizeText(name);


      const tooltip=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "title"
        );


      tooltip.textContent=
        name;


      circle.appendChild(
        tooltip
      );


      circle.addEventListener(
        "click",
        function(){

          selectLocality(
            feature,
            circle
          );

        }
      );


      svg.appendChild(
        circle
      );


      localityElements.push(
        circle
      );

    }
  );

}

/* =========================
   BUSCADOR UNIVERSAL
========================= */

function provinceIdOf(feature){
  return String(
    prop(feature,["id","in1"]) || ""
  ).padStart(2,"0");
}

function departmentIdOf(feature){
  return String(
    prop(feature,["id","in1"]) || ""
  ).trim();
}

function findProvinceById(id){
  return ((provincias && provincias.features) || [])
    .find(function(feature){
      return provinceIdOf(feature)===String(id).padStart(2,"0");
    }) || null;
}

function findDepartmentById(id){
  return ((departamentos && departamentos.features) || [])
    .find(function(feature){
      return departmentIdOf(feature)===String(id).trim();
    }) || null;
}

function buildSearchIndex(){

  const index=[];

  ((provincias && provincias.features) || [])
    .forEach(function(feature){
      index.push({
        type:"province",
        name:featureName(feature),
        province:feature,
        search:normalizeText(featureName(feature))
      });
    });

  ((departamentos && departamentos.features) || [])
    .forEach(function(feature){

      const depId=departmentIdOf(feature);
      const province=findProvinceById(depId.substring(0,2));

      if(!province){ return; }

      const provinceName=featureName(province);
      const departmentName=featureName(feature);

      index.push({
        type:"department",
        name:departmentName,
        subtitle:provinceName,
        province:province,
        department:feature,
        search:normalizeText(
          departmentName+" "+provinceName
        )
      });
    });

  const rawPlaces=
    ((localidades && localidades.features) || [])
      .concat((parajes && parajes.features) || []);

  const seenPlaces=new Set();

  rawPlaces.forEach(function(feature){

    const p=feature.properties || {};
    const depId=String(p.cod_depto || "").trim();
    const provinceId=String(p.cod_pcia || depId.substring(0,2)).trim();

    if(!depId){ return; }

    const department=findDepartmentById(depId);
    const province=findProvinceById(provinceId);

    if(!department || !province){ return; }

    const name=featureName(feature);
    const departmentName=featureName(department);
    const provinceName=featureName(province);

    const coords=
      feature.geometry &&
      feature.geometry.type==="Point" &&
      Array.isArray(feature.geometry.coordinates)
        ? feature.geometry.coordinates
        : [];

    const key=[
      depId,
      normalizeText(name),
      coords.length>=2 ? Number(coords[0]).toFixed(4) : "",
      coords.length>=2 ? Number(coords[1]).toFixed(4) : ""
    ].join("|");

    if(seenPlaces.has(key)){ return; }
    seenPlaces.add(key);

    index.push({
      type:"place",
      name:name,
      subtitle:departmentName+" · "+provinceName,
      province:province,
      department:department,
      place:feature,
      search:normalizeText(
        name+" "+departmentName+" "+provinceName
      )
    });
  });

  searchIndex=index;
}

function closeSearchResults(){
  searchResults.innerHTML="";
  searchResults.classList.remove("visible");
}

function openSearchResult(item){

  closeSearchResults();

  if(item.type==="media"){

    if(item.province){
      showProvince(item.province);
    }

    if(item.department){
      showDepartment(item.department);
    }

    if(item.place){
      const normalized=
        normalizeText(featureName(item.place));

      const circle=
        localityElements.find(function(el){
          return el.dataset.search===normalized;
        });

      selectLocality(
        item.place,
        circle || null
      );
    }else if(item.department){
      renderMediaList(
        mediaForDepartmentFeature(item.department),
        featureName(item.department)
      );
    }else if(item.province){
      renderMediaList(
        mediaForProvinceFeature(item.province),
        featureName(item.province)
      );
    }

    search.value=item.name;
    closeSearchResults();
    return;
  }

  if(item.type==="province"){
    showProvince(item.province);
    return;
  }

  if(item.type==="department"){
    showProvince(item.province);
    showDepartment(item.department);
    return;
  }

  if(item.type==="place"){
    showProvince(item.province);
    showDepartment(item.department);

    const normalized=
      normalizeText(featureName(item.place));

    const circle=
      localityElements.find(function(el){
        return el.dataset.search===normalized;
      });

    selectLocality(
      item.place,
      circle || null
    );

    search.value=item.name;
  }
}

function addMediaToSearchIndex(){

  searchIndex=
    searchIndex.filter(function(item){
      return item.type!=="media";
    });

  mediaCatalog.forEach(function(m){

    searchIndex.push({
      type:"media",
      name:m.title,
      subtitle:
        (m.icon+" ")+
        [
          m.territory.placeName,
          m.territory.departmentName,
          m.territory.provinceName
        ].filter(Boolean).join(" · "),
      media:m,
      province:m.territory.province,
      department:m.territory.department,
      place:m.territory.place,
      search:normalizeText(
        m.title+" "+
        m.labels.join(" ")+" "+
        m.territory.placeName+" "+
        m.territory.departmentName+" "+
        m.territory.provinceName
      )
    });
  });
}


function renderSearchResults(query){

  const normalized=normalizeText(query);

  if(!normalized){
    closeSearchResults();
    return;
  }

  const matches=searchIndex
    .filter(function(item){
      return item.search.indexOf(normalized)!==-1;
    })
    .sort(function(a,b){

      const aName=normalizeText(a.name);
      const bName=normalizeText(b.name);

      const aStarts=aName.indexOf(normalized)===0 ? 0 : 1;
      const bStarts=bName.indexOf(normalized)===0 ? 0 : 1;

      if(aStarts!==bStarts){
        return aStarts-bStarts;
      }

      const order={
        media:0,
        place:1,
        department:2,
        province:3
      };

      if(order[a.type]!==order[b.type]){
        return order[a.type]-order[b.type];
      }

      return a.name.localeCompare(b.name,"es");
    })
    .slice(0,30);

  searchResults.innerHTML="";

  if(!matches.length){
    const empty=document.createElement("div");
    empty.className="search-empty";
    empty.textContent="No encontramos esa Radio, TV o Lugar.";
    searchResults.appendChild(empty);
    searchResults.classList.add("visible");
    return;
  }

  matches.forEach(function(item){

    const button=document.createElement("button");
    button.type="button";
    button.className="search-result";

    const icon=
      item.type==="media"
        ? item.media.icon+" "
        : item.type==="place"
          ? "📍 "
          : item.type==="department"
            ? "🗺️ "
            : "🇦🇷 ";

    const main=document.createElement("span");
    main.textContent=icon+item.name;
    button.appendChild(main);

    if(item.subtitle){
      const small=document.createElement("small");
      small.textContent=item.subtitle;
      button.appendChild(small);
    }

    button.addEventListener(
      "mousedown",
      function(event){
        event.preventDefault();
        openSearchResult(item);
      }
    );

    searchResults.appendChild(button);
  });

  searchResults.classList.add("visible");
}

search.addEventListener(

    clearTimeout(searchTimer);

    searchTimer=setTimeout(

   BLOGGER · CATÁLOGO INTERNO
   Cirugía A: sin cambios visuales
========================= */

function bloggerJsonp(url){
  return new Promise(function(resolve,reject){
    const cb="ntMapMedia_"+Date.now()+"_"+Math.floor(Math.random()*1000000);
    const script=document.createElement("script");
    let done=false;

    function clean(){
      if(script.parentNode) script.parentNode.removeChild(script);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
    }

    const timer=setTimeout(function(){
      if(done)return;
      done=true; clean();
      reject(new Error("Timeout consultando Blogger"));
    },BLOGGER_TIMEOUT);

    window[cb]=function(data){
      if(done)return;
      done=true; clearTimeout(timer); clean(); resolve(data);
    };

    script.onerror=function(){
      if(done)return;
      done=true; clearTimeout(timer); clean();
      reject(new Error("Blogger no respondió al JSONP"));
    };

    script.src=url+(url.indexOf("?")>-1?"&":"?")+
      "alt=json-in-script&callback="+encodeURIComponent(cb)+"&_="+Date.now();
    document.body.appendChild(script);
  });
}

function bloggerLabels(entry){
  return (entry&&entry.category?entry.category:[])
    .map(function(c){return String(c.term||"").trim();})
    .filter(Boolean);
}

function bloggerUrl(entry){
  const links=entry&&entry.link?entry.link:[];
  for(let i=0;i<links.length;i++){
    if(links[i].rel==="alternate") return links[i].href||"";
  }
  return "";
}

async function loadBloggerLabel(label,type){
  let entries=[], requests=0, page=0, hitSafetyLimit=false;

  while(page<BLOGGER_MAX_PAGES){
    const startIndex=page*BLOGGER_PAGE_SIZE+1;
    const url=BLOGGER_BASE+"/feeds/posts/default/-/"+encodeURIComponent(label)+
      "?orderby=published&max-results="+BLOGGER_PAGE_SIZE+
      "&start-index="+startIndex;

    requests++;
    const data=await bloggerJsonp(url);
    const batch=data&&data.feed&&data.feed.entry?data.feed.entry:[];
    entries=entries.concat(batch);

    if(batch.length<BLOGGER_PAGE_SIZE) break;
    page++;
  }

  if(page>=BLOGGER_MAX_PAGES) hitSafetyLimit=true;
  return {label:label,type:type,entries:entries,requests:requests,hitSafetyLimit:hitSafetyLimit};
}

function territoryFromLabels(labels){

  const normalizedLabels=
    labels.map(normalizeText);

  function hasLabel(name){
    return normalizedLabels.indexOf(
      normalizeText(name)
    )!==-1;
  }

  /*
    RESOLUCIÓN TERRITORIAL JERÁRQUICA B.1

    1) Primero Provincia.
    2) Luego Lugar, pero SOLO dentro de esa provincia.
    3) Departamento se hereda del Lugar.
    4) Si no hay Lugar, se intenta Departamento dentro
       de la provincia ya resuelta.
    5) Nunca se usa "Argentina", FM, Online, etc. como
       atajo geográfico nacional.
  */

  const provinceItems=
    searchIndex.filter(function(item){
      return item.type==="province";
    });

  let matchedProvinceItem=null;

  /* "Ciudad de Buenos Aires" es más específica que "Buenos Aires". */
  if(
    normalizedLabels.indexOf(
      normalizeText("Ciudad de Buenos Aires")
    )!==-1
  ){
    matchedProvinceItem=
      provinceItems.find(function(item){
        const n=normalizeText(item.name);
        return (
          n==="ciudad autonoma de buenos aires" ||
          n==="ciudad de buenos aires" ||
          n==="caba"
        );
      }) || null;
  }

  if(!matchedProvinceItem){
    for(let i=0;i<provinceItems.length;i++){

      if(hasLabel(provinceItems[i].name)){
        matchedProvinceItem=provinceItems[i];
        break;
      }
    }
  }

  /*
    Sin provincia explícita no adivinamos un lugar
    nacional por nombre: evitamos homónimos y falsos
    positivos como Argentina → Aguirre → Santiago del Estero.
  */
  if(!matchedProvinceItem){
    return {
      place:null,
      placeName:"",
      department:null,
      departmentName:"",
      province:null,
      provinceName:""
    };
  }

  const province=
    matchedProvinceItem.province;

  const provinceId=
    provinceIdOf(province);

  /*
    Buscamos lugares exclusivamente dentro
    de la provincia ya confirmada.
  */
  const placeItems=
    searchIndex.filter(function(item){

      return (
        item.type==="place" &&
        item.province &&
        provinceIdOf(item.province)===provinceId
      );
    });

  for(let i=0;i<placeItems.length;i++){

    const item=placeItems[i];

    if(hasLabel(item.name)){

      return {
        place:item.place,
        placeName:item.name,
        department:item.department,
        departmentName:
          featureName(item.department),
        province:province,
        provinceName:
          featureName(province)
      };
    }
  }

  /*
    Si no hubo lugar, intentamos departamento/partido,
    también limitado a la provincia confirmada.
  */
  const departmentItems=
    searchIndex.filter(function(item){

      return (
        item.type==="department" &&
        item.province &&
        provinceIdOf(item.province)===provinceId
      );
    });

  for(let i=0;i<departmentItems.length;i++){

    const item=departmentItems[i];

    if(hasLabel(item.name)){

      return {
        place:null,
        placeName:"",
        department:item.department,
        departmentName:item.name,
        province:province,
        provinceName:
          featureName(province)
      };
    }
  }

  /*
    Como mínimo conservamos la provincia real.
    Esto permite detectar editorialmente entradas
    que aún no tengan un Lugar resoluble.
  */
  return {
    place:null,
    placeName:"",
    department:null,
    departmentName:"",
    province:province,
    provinceName:
      featureName(province)
  };
}

function normalizeMedia(entry,type){
  const labels=bloggerLabels(entry);
  return {
    type:type,
    icon:type==="radio"?"📻":"📺",
    title:entry&&entry.title&&entry.title.$t?entry.title.$t.trim():"(sin título)",
    url:bloggerUrl(entry),
    labels:labels,
    territory:territoryFromLabels(labels)
  };
}

async function loadMediaCatalog(){
  const results=await Promise.all([
    loadBloggerLabel("Radios en Vivo","radio"),
    loadBloggerLabel("TV en Vivo","tv")
  ]);

  mediaCatalog=[];
  results.forEach(function(r){
    r.entries.forEach(function(e){mediaCatalog.push(normalizeMedia(e,r.type));});
  });

  mediaLoadReport={
    total:mediaCatalog.length,
    radios:mediaCatalog.filter(function(m){return m.type==="radio";}).length,
    tv:mediaCatalog.filter(function(m){return m.type==="tv";}).length,
    requests:results[0].requests+results[1].requests,
    matchedPlace:mediaCatalog.filter(function(m){return !!m.territory.place;}).length,
    matchedDepartment:mediaCatalog.filter(function(m){return !!m.territory.department;}).length,
    matchedProvince:mediaCatalog.filter(function(m){return !!m.territory.province;}).length,
    unmatched:mediaCatalog.filter(function(m){return !m.territory.province;}).length,
    provinceOnly:mediaCatalog.filter(function(m){
      return !!m.territory.province && !m.territory.department;
    }).length,
    departmentOnly:mediaCatalog.filter(function(m){
      return !!m.territory.department && !m.territory.place;
    }).length
  };

  console.group("NubiTube MAP · Blogger Media · Cirugía A");
  console.table(mediaCatalog.map(function(m){
    return {
      tipo:m.type,
      medio:m.title,
      lugar:m.territory.placeName||"—",
      departamento:m.territory.departmentName||"—",
      provincia:m.territory.provinceName||"—"
    };
  }));
  console.log("Reporte:",mediaLoadReport);
  console.groupEnd();

  addMediaToSearchIndex();
  refreshVisibleMedia();

  return mediaCatalog;
}
