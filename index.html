<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NubiTube MAP</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#07182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0 0 7px;
  font-size:30px;
}

.header p{
  margin:0;
  color:#9fb6cd;
}

.search{
  width:100%;
  padding:14px 16px;
  margin-bottom:12px;
  border:1px solid #17618a;
  border-radius:12px;
  outline:none;
  background:#091c35;
  color:#fff;
  font-size:15px;
}

.search::placeholder{color:#8196ae}

.breadcrumb{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:32px;
  margin:0 0 10px 3px;
  color:#8faac5;
  font-size:13px;
}

.back{
  display:none;
  padding:6px 10px;
  border:1px solid #17618a;
  border-radius:8px;
  background:#091c35;
  color:#9bd9f3;
  cursor:pointer;
}

.back.visible{display:inline-block}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(260px,.65fr);
  gap:15px;
}

.mapbox{
  position:relative;
  min-height:650px;
  overflow:hidden;
  border:1px solid #17618a;
  border-radius:18px;
  background:
    radial-gradient(circle at 50% 40%,#12365e 0%,#091c35 55%,#07182e 100%);
}

svg{
  display:block;
  width:100%;
  height:650px;
}

.region{
  fill:#15547c;
  stroke:#9bd9f3;
  stroke-width:.7;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:fill .15s,stroke .15s,opacity .15s;
}

.region:hover{
  fill:#00a9dc;
  stroke:#fff;
  stroke-width:1.5;
}

.region.selected{
  fill:#00c9ff;
  stroke:#fff;
  stroke-width:2;
}

.region.dimmed{opacity:.15}

.panel{
  padding:22px;
  border:1px solid #17618a;
  border-radius:18px;
  background:#091c35;
}

.panel h2{
  margin:0 0 10px;
  font-size:25px;
}

.panel p{
  margin:0;
  color:#a9bdd2;
  line-height:1.55;
}

.context{
  margin-top:18px !important;
  color:#fff !important;
  font-weight:bold;
}

.tag{
  display:inline-block;
  margin-top:18px;
  padding:6px 10px;
  border:1px solid #00c9ff;
  border-radius:20px;
  color:#00d8ff;
  font-size:11px;
  font-weight:bold;
}

.loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#091c35;
  color:#b8cadd;
  text-align:center;
}

.loading.hidden{display:none}
.error{color:#ffb5b5}

@media(max-width:760px){
  #app{padding:12px}
  .header h1{font-size:25px}
  .layout{grid-template-columns:1fr}
  .mapbox{min-height:500px}
  svg{height:500px}
  .panel{min-height:170px}
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <h1>📍 NubiTube MAP</h1>
    <p>Mapa interactivo de radios y canales de TV de Argentina</p>
  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Buscar provincia..."
    autocomplete="off">

  <div class="breadcrumb">
    <button id="back" class="back" type="button">← Argentina</button>
    <span id="crumb">🇦🇷 Argentina</span>
  </div>

  <div class="layout">

    <div class="mapbox">

      <div id="loading" class="loading">
        Cargando cartografía...
      </div>

      <svg
        id="map"
        viewBox="0 0 800 900"
        preserveAspectRatio="xMidYMid meet"
        aria-label="Mapa interactivo de Argentina">
      </svg>

    </div>

    <aside class="panel">

      <h2 id="title">🇦🇷 Argentina</h2>

      <p id="info">
        Seleccioná una provincia para explorar sus departamentos y medios.
      </p>

      <p id="context" class="context">
        Explorá radios y canales de TV de Argentina
      </p>

      <span id="tag" class="tag">
        Seleccioná una provincia
      </span>

    </aside>

  </div>

</div>

<script>
(function(){

"use strict";

const PROVINCIAS_URL="./data/argentina.geojson";
const DEPARTAMENTOS_URL="./data/departamentos.geojson";

const svg=document.getElementById("map");
const loading=document.getElementById("loading");
const title=document.getElementById("title");
const info=document.getElementById("info");
const context=document.getElementById("context");
const tag=document.getElementById("tag");
const search=document.getElementById("search");
const back=document.getElementById("back");
const crumb=document.getElementById("crumb");

let provincias=null;
let departamentos=null;
let currentLevel="country";
let currentProvince=null;
let regionElements=[];


/* NORMALIZAR */

function normalizeText(text){
  return String(text||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}


/* ANILLOS GEOGRÁFICOS */

function rawRings(geometry){

  if(!geometry) return [];

  if(geometry.type==="Polygon"){
    return geometry.coordinates;
  }

  if(geometry.type==="MultiPolygon"){
    return geometry.coordinates.reduce(
      (all,polygon)=>all.concat(polygon),[]
    );
  }

  return [];
}


/*
 VISTA PRINCIPAL NUBITUBE

 Conservamos el territorio útil para navegación
 del mapa principal: Argentina continental,
 Tierra del Fuego e islas próximas.

 La cartografía fuente no se modifica.
 Sólo cambia el encuadre visual.
*/

function ringVisible(ring){

  if(!ring || !ring.length) return false;

  let lon=0;
  let lat=0;

  ring.forEach(p=>{
    lon+=p[0];
    lat+=p[1];
  });

  lon/=ring.length;
  lat/=ring.length;

  return (
    lon>=-76 &&
    lon<=-52 &&
    lat>=-57
  );
}


function displayRings(geometry){

  return rawRings(geometry).filter(ringVisible);

}


/* PROYECCIÓN */

function createProjection(features){

  const points=[];

  features.forEach(feature=>{

    displayRings(feature.geometry).forEach(ring=>{

      ring.forEach(point=>points.push(point));

    });

  });

  if(!points.length){
    throw new Error("No se encontraron geometrías visibles.");
  }

  const xs=points.map(p=>p[0]);
  const ys=points.map(p=>p[1]);

  const minX=Math.min(...xs);
  const maxX=Math.max(...xs);
  const minY=Math.min(...ys);
  const maxY=Math.max(...ys);

  const W=800;
  const H=900;
  const PAD=35;

  const scale=Math.min(
    (W-PAD*2)/(maxX-minX),
    (H-PAD*2)/(maxY-minY)
  );

  const usedW=(maxX-minX)*scale;
  const usedH=(maxY-minY)*scale;

  const offsetX=(W-usedW)/2;
  const offsetY=(H-usedH)/2;

  return {
    x:lon=>offsetX+(lon-minX)*scale,
    y:lat=>H-(offsetY+(lat-minY)*scale)
  };
}


/* SVG PATH */

function geometryToPath(geometry,project){

  return displayRings(geometry)

    .map(ring=>

      ring.map((point,index)=>{

        const x=project.x(point[0]).toFixed(2);
        const y=project.y(point[1]).toFixed(2);

        return (index===0?"M":"L")+x+","+y;

      }).join("")+"Z"

    ).join("");
}


/* DIBUJAR */

function drawFeatures(features,onClick){

  svg.innerHTML="";
  regionElements=[];

  const visible=features.filter(feature=>
    displayRings(feature.geometry).length
  );

  const project=createProjection(visible);

  visible.forEach(feature=>{

    const props=feature.properties||{};
    const name=props.nombre||props.name||"Sin nombre";

    const d=geometryToPath(feature.geometry,project);

    if(!d) return;

    const path=document.createElementNS(
      "http://www.w3.org/2000/svg","path"
    );

    path.setAttribute("d",d);
    path.setAttribute("class","region");

    path.dataset.name=name;
    path.dataset.search=normalizeText(name);

    const tooltip=document.createElementNS(
      "http://www.w3.org/2000/svg","title"
    );

    tooltip.textContent=name;
    path.appendChild(tooltip);

    path.addEventListener("click",()=>{
      onClick(feature,path);
    });

    svg.appendChild(path);
    regionElements.push(path);

  });

}


/* ARGENTINA */

function showArgentina(){

  currentLevel="country";
  currentProvince=null;

  search.value="";
  search.placeholder="🔎 Buscar provincia...";

  back.classList.remove("visible");

  crumb.textContent="🇦🇷 Argentina";

  title.textContent="🇦🇷 Argentina";

  info.textContent=
    "Seleccioná una provincia para explorar sus departamentos y medios.";

  context.textContent=
    "Explorá radios y canales de TV de Argentina";

  tag.textContent="Seleccioná una provincia";

  drawFeatures(
    provincias.features,
    function(feature){
      showProvince(feature);
    }
  );

}


/* PROVINCIA */

function showProvince(provinceFeature){

  const props=provinceFeature.properties||{};

  const provinceName=props.nombre||"Provincia";
  const provinceId=String(props.id||"").padStart(2,"0");

  currentLevel="province";
  currentProvince={
    id:provinceId,
    name:provinceName
  };

  const filtered=departamentos.features.filter(feature=>{

    const depId=String(
      (feature.properties||{}).id||""
    );

    return depId.substring(0,2)===provinceId;

  });

  search.value="";
  search.placeholder="🔎 Buscar departamento...";

  back.classList.add("visible");

  crumb.textContent="Argentina › "+provinceName;

  title.textContent=provinceName;

  info.textContent=
    "Seleccioná un departamento para continuar explorando.";

  context.textContent=
    "Explorá radios y canales de TV de "+provinceName;

  tag.textContent=
    filtered.length+" departamentos";

  if(!filtered.length){

    svg.innerHTML="";

    info.textContent=
      "Todavía no encontramos departamentos asociados a esta provincia.";

    return;
  }

  drawFeatures(
    filtered,
    function(feature,path){

      regionElements.forEach(item=>
        item.classList.remove("selected")
      );

      path.classList.add("selected");

      const depName=
        (feature.properties||{}).nombre||
        "Departamento";

      title.textContent=depName;

      info.textContent=
        "Departamento seleccionado. En la siguiente etapa conectaremos aquí sus radios y canales de TV.";

      context.textContent=
        "Explorá radios y canales de TV de "+depName;

      tag.textContent="Departamento seleccionado";

    }
  );

}


/* BUSCADOR */

search.addEventListener("input",function(){

  const query=normalizeText(search.value);

  regionElements.forEach(path=>{
    path.classList.remove("selected","dimmed");
  });

  if(!query) return;

  const matches=regionElements.filter(path=>
    path.dataset.search.includes(query)
  );

  regionElements.forEach(path=>{

    if(!matches.includes(path)){
      path.classList.add("dimmed");
    }

  });

  if(matches.length===1){
    matches[0].classList.add("selected");
  }

});


/* VOLVER */

back.addEventListener("click",showArgentina);


/* CARGA */

Promise.all([

  fetch(PROVINCIAS_URL,{cache:"no-store"})
    .then(r=>{
      if(!r.ok) throw new Error("Provincias HTTP "+r.status);
      return r.json();
    }),

  fetch(DEPARTAMENTOS_URL,{cache:"no-store"})
    .then(r=>{
      if(!r.ok) throw new Error("Departamentos HTTP "+r.status);
      return r.json();
    })

])

.then(([provData,depData])=>{

  provincias=provData;
  departamentos=depData;

  loading.classList.add("hidden");

  showArgentina();

})

.catch(error=>{

  console.error("NubiTube MAP:",error);

  loading.innerHTML=
    '<span class="error">'+
    'No se pudo cargar la cartografía.<br>'+
    'Error: '+error.message+
    '</span>';

});

})();
</script>

</body>
</html>
