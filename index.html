<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NubiTube MAP</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#07182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0 0 7px;
  font-size:30px;
}

.header p{
  margin:0;
  color:#9fb6cd;
}

.search{
  width:100%;
  padding:14px 16px;
  margin-bottom:12px;
  border:1px solid #17618a;
  border-radius:12px;
  outline:none;
  background:#091c35;
  color:#fff;
  font-size:15px;
}

.search::placeholder{color:#8196ae}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  min-height:32px;
  margin:0 0 10px 3px;
  color:#8faac5;
  font-size:13px;
}

.crumb-btn{
  border:0;
  padding:0;
  background:none;
  color:#8fdcff;
  cursor:pointer;
  font:inherit;
}

.crumb-btn:hover{
  color:#fff;
  text-decoration:underline;
}

.crumb-current{
  color:#c6d7e7;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(260px,.65fr);
  gap:15px;
}

.mapbox{
  position:relative;
  min-height:650px;
  overflow:hidden;
  border:1px solid #17618a;
  border-radius:18px;
  background:
    radial-gradient(circle at 50% 40%,#12365e 0%,#091c35 55%,#07182e 100%);
}

svg{
  display:block;
  width:100%;
  height:650px;
}

.region{
  fill:#15547c;
  stroke:#9bd9f3;
  stroke-width:.7;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:fill .15s,stroke .15s,opacity .15s;
}

.region:hover{
  fill:#00a9dc;
  stroke:#fff;
  stroke-width:1.5;
}

.region.selected{
  fill:#00c9ff;
  stroke:#fff;
  stroke-width:2;
}

.region.dimmed,
.locality.dimmed{
  opacity:.12;
}

.locality{
  fill:#00d8ff;
  stroke:#fff;
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:opacity .15s,fill .15s;
}

.locality:hover,
.locality.selected{
  fill:#fff;
  stroke:#00d8ff;
  stroke-width:2.5;
}

.panel{
  padding:22px;
  border:1px solid #17618a;
  border-radius:18px;
  background:#091c35;
}

.panel h2{
  margin:0 0 10px;
  font-size:25px;
}

.panel p{
  margin:0;
  color:#a9bdd2;
  line-height:1.55;
}

.context{
  margin-top:18px !important;
  color:#fff !important;
  font-weight:bold;
}

.tag{
  display:inline-block;
  margin-top:18px;
  padding:6px 10px;
  border:1px solid #00c9ff;
  border-radius:20px;
  color:#00d8ff;
  font-size:11px;
  font-weight:bold;
}

.locality-list{
  display:none;
  margin-top:18px;
  border-top:1px solid #163b5b;
  padding-top:14px;
}

.locality-list.visible{
  display:block;
}

.locality-item{
  display:block;
  width:100%;
  margin:0 0 7px;
  padding:9px 11px;
  border:1px solid #174c70;
  border-radius:9px;
  background:#0b2340;
  color:#d9efff;
  text-align:left;
  cursor:pointer;
}

.locality-item:hover{
  border-color:#00c9ff;
  color:#fff;
}

.loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#091c35;
  color:#b8cadd;
  text-align:center;
}

.loading.hidden{display:none}
.error{color:#ffb5b5}

@media(max-width:760px){

  #app{padding:12px}

  .header h1{font-size:25px}

  .layout{grid-template-columns:1fr}

  .mapbox{min-height:500px}

  svg{height:500px}

  .panel{min-height:170px}
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <h1>📍 NubiTube MAP</h1>
    <p>Mapa interactivo de radios y canales de TV de Argentina</p>
  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Buscar provincia..."
    autocomplete="off">

  <div id="breadcrumb" class="breadcrumb"></div>

  <div class="layout">

    <div class="mapbox">

      <div id="loading" class="loading">
        Cargando cartografía...
      </div>

      <svg
        id="map"
        viewBox="0 0 800 900"
        preserveAspectRatio="xMidYMid meet"
        aria-label="Mapa interactivo de Argentina">
      </svg>

    </div>

    <aside class="panel">

      <h2 id="title">🇦🇷 Argentina</h2>

      <p id="info">
        Seleccioná una provincia para explorar sus departamentos y medios.
      </p>

      <p id="context" class="context">
        Explorá radios y canales de TV de Argentina
      </p>

      <span id="tag" class="tag">
        Seleccioná una provincia
      </span>

      <div id="localityList" class="locality-list"></div>

    </aside>

  </div>

</div>

<script>
(function(){

"use strict";

const PROVINCIAS_URL="./data/argentina.geojson";
const DEPARTAMENTOS_URL="./data/departamentos.geojson";
const LOCALIDADES_URL="./data/localidad_bahra.geojson";

const svg=document.getElementById("map");
const loading=document.getElementById("loading");
const title=document.getElementById("title");
const info=document.getElementById("info");
const context=document.getElementById("context");
const tag=document.getElementById("tag");
const search=document.getElementById("search");
const breadcrumb=document.getElementById("breadcrumb");
const localityList=document.getElementById("localityList");

let provincias=null;
let departamentos=null;
let localidades=null;

let currentLevel="country";
let currentProvince=null;
let currentDepartment=null;

let regionElements=[];
let localityElements=[];


/* =========================
   NORMALIZACIÓN
========================= */

function normalizeText(text){

  return String(text||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

}


/* =========================
   PROPIEDADES
========================= */

function prop(obj,names){

  const p=(obj && obj.properties) || {};

  for(const name of names){

    if(
      p[name]!==undefined &&
      p[name]!==null &&
      String(p[name]).trim()!==""
    ){
      return p[name];
    }

  }

  return "";

}


function featureName(feature){

  return String(
    prop(feature,[
      "nombre",
      "nam",
      "nombre_localidad",
      "localidad",
      "name"
    ]) || "Sin nombre"
  );

}


/* =========================
   GEOMETRÍAS
========================= */

function rawRings(geometry){

  if(!geometry) return [];

  if(geometry.type==="Polygon"){
    return geometry.coordinates;
  }

  if(geometry.type==="MultiPolygon"){

    return geometry.coordinates.reduce(
      (all,polygon)=>all.concat(polygon),
      []
    );

  }

  return [];

}


/*
 Vista principal:
 Argentina continental + Tierra del Fuego
 e islas próximas.

 La fuente original no se modifica.
*/

function ringVisible(ring){

  if(!ring || !ring.length) return false;

  let lon=0;
  let lat=0;

  ring.forEach(p=>{
    lon+=p[0];
    lat+=p[1];
  });

  lon/=ring.length;
  lat/=ring.length;

  return (
    lon>=-76 &&
    lon<=-52 &&
    lat>=-57
  );

}


function displayRings(geometry){

  return rawRings(geometry).filter(ringVisible);

}


/* =========================
   PROYECCIÓN POLÍGONOS
========================= */

function createProjection(features){

  const points=[];

  features.forEach(feature=>{

    displayRings(feature.geometry).forEach(ring=>{

      ring.forEach(point=>{
        points.push(point);
      });

    });

  });

  if(!points.length){
    throw new Error("No se encontraron geometrías visibles.");
  }

  const xs=points.map(p=>p[0]);
  const ys=points.map(p=>p[1]);

  const minX=Math.min(...xs);
  const maxX=Math.max(...xs);
  const minY=Math.min(...ys);
  const maxY=Math.max(...ys);

  const W=800;
  const H=900;
  const PAD=35;

  const scale=Math.min(
    (W-PAD*2)/(maxX-minX),
    (H-PAD*2)/(maxY-minY)
  );

  const usedW=(maxX-minX)*scale;
  const usedH=(maxY-minY)*scale;

  const offsetX=(W-usedW)/2;
  const offsetY=(H-usedH)/2;

  return {

    x:lon=>offsetX+(lon-minX)*scale,

    y:lat=>H-(offsetY+(lat-minY)*scale)

  };

}


function geometryToPath(geometry,project){

  return displayRings(geometry)

    .map(ring=>

      ring.map((point,index)=>{

        const x=project.x(point[0]).toFixed(2);
        const y=project.y(point[1]).toFixed(2);

        return (index===0?"M":"L")+x+","+y;

      }).join("")+"Z"

    ).join("");

}


/* =========================
   BREADCRUMB
========================= */

function renderBreadcrumb(){

  breadcrumb.innerHTML="";

  if(currentLevel==="country"){

    const span=document.createElement("span");
    span.className="crumb-current";
    span.textContent="🇦🇷 Argentina";

    breadcrumb.appendChild(span);
    return;

  }


  const argentina=document.createElement("button");

  argentina.className="crumb-btn";
  argentina.textContent="🇦🇷 Argentina";

  argentina.addEventListener("click",showArgentina);

  breadcrumb.appendChild(argentina);


  const sep1=document.createElement("span");
  sep1.textContent="›";
  breadcrumb.appendChild(sep1);


  if(currentLevel==="province"){

    const current=document.createElement("span");

    current.className="crumb-current";
    current.textContent=currentProvince.name;

    breadcrumb.appendChild(current);

    return;
  }


  const provinceButton=document.createElement("button");

  provinceButton.className="crumb-btn";
  provinceButton.textContent=currentProvince.name;

  provinceButton.addEventListener("click",function(){

    showProvince(currentProvince.feature);

  });

  breadcrumb.appendChild(provinceButton);


  const sep2=document.createElement("span");
  sep2.textContent="›";

  breadcrumb.appendChild(sep2);


  const current=document.createElement("span");

  current.className="crumb-current";
  current.textContent=currentDepartment.name;

  breadcrumb.appendChild(current);

}


/* =========================
   DIBUJAR POLÍGONOS
========================= */

function drawFeatures(features,onClick){

  svg.innerHTML="";

  regionElements=[];
  localityElements=[];

  const visible=features.filter(feature=>
    displayRings(feature.geometry).length
  );

  const project=createProjection(visible);

  visible.forEach(feature=>{

    const name=featureName(feature);

    const d=geometryToPath(
      feature.geometry,
      project
    );

    if(!d) return;

    const path=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    path.setAttribute("d",d);
    path.setAttribute("class","region");

    path.dataset.name=name;
    path.dataset.search=normalizeText(name);

    const tooltip=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "title"
    );

    tooltip.textContent=name;

    path.appendChild(tooltip);


    path.addEventListener("click",function(){

      onClick(feature,path,project);

    });


    svg.appendChild(path);

    regionElements.push(path);

  });


  return project;

}


/* =========================
   ARGENTINA
========================= */

function showArgentina(){

  currentLevel="country";
  currentProvince=null;
  currentDepartment=null;

  search.value="";
  search.placeholder="🔎 Buscar provincia...";

  localityList.innerHTML="";
  localityList.classList.remove("visible");

  title.textContent="🇦🇷 Argentina";

  info.textContent=
    "Seleccioná una provincia para explorar sus departamentos y medios.";

  context.textContent=
    "Explorá radios y canales de TV de Argentina";

  tag.textContent=
    "Seleccioná una provincia";

  renderBreadcrumb();


  drawFeatures(
    provincias.features,
    function(feature){

      showProvince(feature);

    }
  );

}


/* =========================
   PROVINCIA
========================= */

function showProvince(provinceFeature){

  const provinceName=featureName(provinceFeature);

  const provinceId=String(
    prop(provinceFeature,["id","in1"])
  ).padStart(2,"0");


  currentLevel="province";

  currentProvince={
    id:provinceId,
    name:provinceName,
    feature:provinceFeature
  };

  currentDepartment=null;

  search.value="";
  search.placeholder="🔎 Buscar departamento...";

  localityList.innerHTML="";
  localityList.classList.remove("visible");


  const filtered=departamentos.features.filter(feature=>{

    const depId=String(
      prop(feature,["id","in1"])
    );

    return depId.substring(0,2)===provinceId;

  });


  title.textContent=provinceName;

  info.textContent=
    "Seleccioná un departamento para explorar sus localidades.";

  context.textContent=
    "Explorá radios y canales de TV de "+provinceName;

  tag.textContent=
    filtered.length+" departamentos";

  renderBreadcrumb();


  if(!filtered.length){

    svg.innerHTML="";

    info.textContent=
      "No encontramos departamentos asociados a esta provincia.";

    return;

  }


  drawFeatures(
    filtered,
    function(feature){

      showDepartment(feature);

    }
  );

}


/* =========================
   LOCALIDADES DEL
   DEPARTAMENTO
========================= */

function departmentLocalities(departmentFeature){

  const depId=String(
    prop(departmentFeature,["id","in1"])
  );


  return localidades.features.filter(feature=>{

    const p=(feature.properties||{});


    /*
      BAHRA/IGN puede incluir diferentes
      denominaciones de campos según versión.

      Primero buscamos códigos oficiales.
    */

    const possibleCodes=[
      p.departamento_id,
      p.departamento_codigo,
      p.codigo_departamento,
      p.in1,
      p.in2,
      p.fdc
    ]
    .filter(v=>
      v!==undefined &&
      v!==null &&
      String(v)!==""
    )
    .map(v=>String(v));


    if(possibleCodes.some(code=>
      code===depId ||
      code.startsWith(depId)
    )){
      return true;
    }


    /*
      Respaldo por nombre + provincia.
    */

    const departmentName=normalizeText(
      prop(feature,[
        "departamento",
        "nombre_departamento",
        "departamento_nombre"
      ])
    );

    const provinceName=normalizeText(
      prop(feature,[
        "provincia",
        "nombre_provincia",
        "provincia_nombre"
      ])
    );


    return (
      departmentName===
        normalizeText(featureName(departmentFeature))
      &&
      provinceName===
        normalizeText(currentProvince.name)
    );

  });

}


/* =========================
   DEPARTAMENTO
========================= */

function showDepartment(departmentFeature){

  const departmentName=
    featureName(departmentFeature);

  currentLevel="department";

  currentDepartment={
    id:String(
      prop(departmentFeature,["id","in1"])
    ),
    name:departmentName,
    feature:departmentFeature
  };


  search.value="";
  search.placeholder="🔎 Buscar localidad...";


  const localities=
    departmentLocalities(departmentFeature);


  title.textContent=departmentName;

  info.textContent=
    "Seleccioná una localidad para explorar sus radios y canales de TV.";

  context.textContent=
    "Explorá radios y canales de TV de "+departmentName;

  tag.textContent=
    localities.length+
    (localities.length===1
      ?" localidad"
      :" localidades");

  renderBreadcrumb();


  const project=drawFeatures(
    [departmentFeature],
    function(){}
  );


  drawLocalities(
    localities,
    project
  );


  renderLocalityList(localities);

}


/* =========================
   PUNTOS DE LOCALIDAD
========================= */

function drawLocalities(features,project){

  localityElements=[];


  features.forEach(feature=>{

    if(
      !feature.geometry ||
      feature.geometry.type!=="Point"
    ){
      return;
    }


    const coords=feature.geometry.coordinates;

    if(
      !Array.isArray(coords) ||
      coords.length<2
    ){
      return;
    }


    const name=featureName(feature);

    const circle=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );


    circle.setAttribute(
      "cx",
      project.x(coords[0])
    );

    circle.setAttribute(
      "cy",
      project.y(coords[1])
    );

    circle.setAttribute("r","7");
    circle.setAttribute("class","locality");

    circle.dataset.name=name;
    circle.dataset.search=normalizeText(name);


    const tooltip=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "title"
    );

    tooltip.textContent=name;

    circle.appendChild(tooltip);


    circle.addEventListener("click",function(){

      selectLocality(
        feature,
        circle
      );

    });


    svg.appendChild(circle);

    localityElements.push(circle);

  });

}


/* =========================
   LISTA DE LOCALIDADES
========================= */

function renderLocalityList(features){

  localityList.innerHTML="";


  if(!features.length){

    localityList.classList.remove("visible");
    return;

  }


  const sorted=[...features].sort((a,b)=>

    featureName(a).localeCompare(
      featureName(b),
      "es"
    )

  );


  sorted.forEach(feature=>{

    const button=document.createElement("button");

    button.className="locality-item";

    button.textContent=
      "📍 "+featureName(feature);


    button.addEventListener("click",function(){

      const normalized=
        normalizeText(featureName(feature));

      const circle=
        localityElements.find(el=>
          el.dataset.search===normalized
        );

      selectLocality(
        feature,
        circle || null
      );

    });


    localityList.appendChild(button);

  });


  localityList.classList.add("visible");

}


/* =========================
   SELECCIONAR LOCALIDAD
========================= */

function selectLocality(feature,circle){

  localityElements.forEach(el=>
    el.classList.remove("selected")
  );


  if(circle){
    circle.classList.add("selected");
  }


  const name=featureName(feature);


  title.textContent=name;

  info.textContent=
    "Localidad seleccionada. Aquí conectaremos automáticamente sus radios y canales de TV publicados en NubiTube.";

  context.textContent=
    "Explorá radios y canales de TV de "+name;

  tag.textContent=
    "Localidad seleccionada";

}


/* =========================
   BUSCADOR
========================= */

search.addEventListener("input",function(){

  const query=normalizeText(search.value);

  const elements=
    currentLevel==="department"
      ? localityElements
      : regionElements;


  elements.forEach(el=>{

    el.classList.remove(
      "selected",
      "dimmed"
    );

  });


  if(!query){
    return;
  }


  const matches=elements.filter(el=>

    el.dataset.search.includes(query)

  );


  elements.forEach(el=>{

    if(!matches.includes(el)){
      el.classList.add("dimmed");
    }

  });


  if(matches.length===1){

    matches[0].classList.add("selected");

  }

});


/* =========================
   CARGA DE DATOS
========================= */

Promise.all([

  fetch(PROVINCIAS_URL,{
    cache:"no-store"
  })
  .then(r=>{

    if(!r.ok){
      throw new Error(
        "Provincias HTTP "+r.status
      );
    }

    return r.json();

  }),


  fetch(DEPARTAMENTOS_URL,{
    cache:"no-store"
  })
  .then(r=>{

    if(!r.ok){
      throw new Error(
        "Departamentos HTTP "+r.status
      );
    }

    return r.json();

  }),


  fetch(LOCALIDADES_URL,{
    cache:"no-store"
  })
  .then(r=>{

    if(!r.ok){
      throw new Error(
        "Localidades HTTP "+r.status
      );
    }

    return r.json();

  })

])

.then(function(data){

  provincias=data[0];
  departamentos=data[1];
  localidades=data[2];

  loading.classList.add("hidden");

  showArgentina();

})

.catch(function(error){

  console.error(
    "NubiTube MAP:",
    error
  );

  loading.innerHTML=
    '<span class="error">'+
    'No se pudo cargar la cartografía.<br>'+
    'Error: '+error.message+
    '</span>';

});

})();
</script>

</body>
</html>
