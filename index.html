<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NubiTube MAP</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#07182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0 0 7px;
  font-size:30px;
}

.header p{
  margin:0;
  color:#9fb6cd;
}

.search{
  width:100%;
  padding:14px 16px;
  margin-bottom:12px;
  border:1px solid #17618a;
  border-radius:12px;
  outline:none;
  background:#091c35;
  color:#fff;
  font-size:15px;
}

.search::placeholder{
  color:#8196ae;
}

.navbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  min-height:38px;
  margin:0 0 10px 3px;
}

.back{
  display:none;
  padding:7px 11px;
  border:1px solid #17618a;
  border-radius:8px;
  background:#091c35;
  color:#9bd9f3;
  cursor:pointer;
  font-size:13px;
}

.back.visible{
  display:inline-block;
}

.back:hover{
  border-color:#00c9ff;
  color:#fff;
}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  color:#8faac5;
  font-size:13px;
}

.crumb-btn{
  border:0;
  padding:0;
  background:none;
  color:#8fdcff;
  cursor:pointer;
  font:inherit;
}

.crumb-btn:hover{
  color:#fff;
  text-decoration:underline;
}

.crumb-current{
  color:#c6d7e7;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(260px,.65fr);
  gap:15px;
}

.mapbox{
  position:relative;
  min-height:650px;
  overflow:hidden;
  border:1px solid #17618a;
  border-radius:18px;
  background:
    radial-gradient(
      circle at 50% 40%,
      #12365e 0%,
      #091c35 55%,
      #07182e 100%
    );
}

svg{
  display:block;
  width:100%;
  height:650px;
}

.region{
  fill:#15547c;
  stroke:#9bd9f3;
  stroke-width:.7;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:
    fill .15s,
    stroke .15s,
    opacity .15s;
}

.region:hover{
  fill:#00a9dc;
  stroke:#fff;
  stroke-width:1.5;
}

.region.selected{
  fill:#00c9ff;
  stroke:#fff;
  stroke-width:2;
}

.region.dimmed,
.locality.dimmed{
  opacity:.12;
}

.locality{
  fill:#00d8ff;
  stroke:#fff;
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  transition:
    opacity .15s,
    fill .15s,
    stroke .15s;
}

.locality:hover,
.locality.selected{
  fill:#fff;
  stroke:#00d8ff;
  stroke-width:2.5;
}

.panel{
  padding:22px;
  border:1px solid #17618a;
  border-radius:18px;
  background:#091c35;
}

.panel h2{
  margin:0 0 10px;
  font-size:25px;
}

.panel p{
  margin:0;
  color:#a9bdd2;
  line-height:1.55;
}

.context{
  margin-top:18px !important;
  color:#fff !important;
  font-weight:bold;
}

.tag{
  display:inline-block;
  margin-top:18px;
  padding:6px 10px;
  border:1px solid #00c9ff;
  border-radius:20px;
  color:#00d8ff;
  font-size:11px;
  font-weight:bold;
}

.locality-list{
  display:none;
  margin-top:18px;
  border-top:1px solid #163b5b;
  padding-top:14px;
}

.locality-list.visible{
  display:block;
}

.locality-item{
  display:block;
  width:100%;
  margin:0 0 7px;
  padding:9px 11px;
  border:1px solid #174c70;
  border-radius:9px;
  background:#0b2340;
  color:#d9efff;
  text-align:left;
  cursor:pointer;
}

.locality-item:hover,
.locality-item.selected{
  border-color:#00c9ff;
  color:#fff;
  background:#103153;
}

.loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#091c35;
  color:#b8cadd;
  text-align:center;
}

.loading.hidden{
  display:none;
}

.error{
  color:#ffb5b5;
}

@media(max-width:760px){

  #app{
    padding:10px;
  }

  .header{
    margin-bottom:12px;
  }

  .header h1{
    font-size:24px;
    margin-bottom:5px;
  }

  .header p{
    font-size:13px;
    line-height:1.35;
    padding:0 6px;
  }

  .search{
    margin-bottom:9px;
    padding:13px 14px;
    border-radius:10px;
    font-size:16px;
  }

  .navbar{
    min-height:0;
    margin:0 0 9px 1px;
    gap:6px;
    align-items:flex-start;
    flex-direction:column;
  }

  .back{
    min-height:40px;
    padding:9px 12px;
    font-size:13px;
  }

  .breadcrumb{
    width:100%;
    gap:5px;
    font-size:12px;
    line-height:1.45;
  }

  .crumb-btn{
    min-height:30px;
  }

  .layout{
    grid-template-columns:1fr;
    gap:10px;
  }

  .mapbox{
    min-height:430px;
    border-radius:14px;
  }

  svg{
    height:430px;
  }

  .panel{
    min-height:0;
    padding:17px;
    border-radius:14px;
  }

  .panel h2{
    font-size:22px;
    margin-bottom:8px;
  }

  .panel p{
    font-size:14px;
    line-height:1.45;
  }

  .context{
    margin-top:13px !important;
  }

  .tag{
    margin-top:13px;
  }

  .locality-list{
    margin-top:14px;
    padding-top:12px;
  }

  .locality-item{
    min-height:44px;
    margin-bottom:7px;
    padding:11px 12px;
    font-size:14px;
  }
}

@media(max-width:420px){

  #app{
    padding:8px;
  }

  .header h1{
    font-size:22px;
  }

  .header p{
    font-size:12px;
  }

  .mapbox{
    min-height:390px;
  }

  svg{
    height:390px;
  }

  .panel{
    padding:15px;
  }

  .panel h2{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <h1>📍 NubiTube MAP</h1>
    <p>Mapa interactivo de radios y canales de TV de Argentina</p>
  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Buscar Radio, TV o Lugar..."
    autocomplete="off">

  <div class="navbar">

    <button
      id="back"
      class="back"
      type="button">
      ← Volver
    </button>

    <div
      id="breadcrumb"
      class="breadcrumb">
    </div>

  </div>

  <div class="layout">

    <div class="mapbox">

      <div
        id="loading"
        class="loading">
        Cargando cartografía...
      </div>

      <svg
        id="map"
        viewBox="0 0 800 900"
        preserveAspectRatio="xMidYMid meet"
        aria-label="Mapa interactivo de Argentina">
      </svg>

    </div>

    <aside class="panel">

      <h2 id="title">
        🇦🇷 Argentina
      </h2>

      <p id="info">
        Seleccioná una provincia para explorar sus departamentos y medios.
      </p>

      <p
        id="context"
        class="context">
        Explorá radios y canales de TV de Argentina
      </p>

      <span
        id="tag"
        class="tag">
        Seleccioná una provincia
      </span>

      <div
        id="localityList"
        class="locality-list">
      </div>

    </aside>

  </div>

</div>

<script>
(function(){

"use strict";

/* =========================
   ARCHIVOS
========================= */

const PROVINCIAS_URL=
  "./data/argentina.geojson";

const DEPARTAMENTOS_URL=
  "./data/departamentos.geojson";

const LOCALIDADES_URL=
  "./data/localidad_bahra.geojson";

const PARAJES_URL=
  "./data/bahra_paraje.geojson";


/* =========================
   ELEMENTOS
========================= */

const svg=
  document.getElementById("map");

const loading=
  document.getElementById("loading");

const title=
  document.getElementById("title");

const info=
  document.getElementById("info");

const context=
  document.getElementById("context");

const tag=
  document.getElementById("tag");

const search=
  document.getElementById("search");

const breadcrumb=
  document.getElementById("breadcrumb");

const back=
  document.getElementById("back");

const localityList=
  document.getElementById("localityList");


/* =========================
   ESTADO
========================= */

let provincias=null;
let departamentos=null;
let localidades=null;
let parajes=null;

let currentLevel="country";

let currentProvince=null;
let currentDepartment=null;

let regionElements=[];
let localityElements=[];


/* =========================
   NORMALIZACIÓN
========================= */

function normalizeText(text){

  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

}


/* =========================
   PROPIEDADES
========================= */

function prop(feature,names){

  const p=
    (feature && feature.properties) || {};

  for(const name of names){

    if(
      p[name]!==undefined &&
      p[name]!==null &&
      String(p[name]).trim()!==""
    ){
      return p[name];
    }

  }

  return "";

}


function featureName(feature){

  return String(

    prop(feature,[

      "nombre",
      "nam",

      /* BAHRA */
      "fna",
      "nom_agl",
      "nom_aglo",

      "nombre_localidad",
      "localidad",
      "name"

    ]) || "Sin nombre"

  );

}


/* =========================
   GEOMETRÍAS
========================= */

function rawRings(geometry){

  if(!geometry){
    return [];
  }

  if(geometry.type==="Polygon"){
    return geometry.coordinates;
  }

  if(geometry.type==="MultiPolygon"){

    return geometry.coordinates.reduce(
      function(all,polygon){
        return all.concat(polygon);
      },
      []
    );

  }

  return [];

}


/*
  Encuadre NubiTube MAP:
  Argentina continental +
  Tierra del Fuego +
  islas próximas.

  No altera el archivo original.
*/

function ringVisible(ring){

  if(!ring || !ring.length){
    return false;
  }

  let lon=0;
  let lat=0;

  ring.forEach(function(point){

    lon+=point[0];
    lat+=point[1];

  });

  lon/=ring.length;
  lat/=ring.length;

  return (
    lon>=-76 &&
    lon<=-52 &&
    lat>=-57
  );

}


function displayRings(geometry){

  return rawRings(geometry)
    .filter(ringVisible);

}


/* =========================
   PROYECCIÓN
========================= */

function createProjection(features){

  const points=[];

  features.forEach(function(feature){

    displayRings(feature.geometry)
      .forEach(function(ring){

        ring.forEach(function(point){

          points.push(point);

        });

      });

  });


  if(!points.length){

    throw new Error(
      "No se encontraron geometrías visibles."
    );

  }


  const xs=
    points.map(function(p){
      return p[0];
    });

  const ys=
    points.map(function(p){
      return p[1];
    });


  const minX=Math.min.apply(null,xs);
  const maxX=Math.max.apply(null,xs);

  const minY=Math.min.apply(null,ys);
  const maxY=Math.max.apply(null,ys);


  const W=800;
  const H=900;
  const PAD=35;


  const scale=Math.min(

    (W-PAD*2)/(maxX-minX),

    (H-PAD*2)/(maxY-minY)

  );


  const usedW=
    (maxX-minX)*scale;

  const usedH=
    (maxY-minY)*scale;


  const offsetX=
    (W-usedW)/2;

  const offsetY=
    (H-usedH)/2;


  return {

    x:function(lon){

      return offsetX+
        (lon-minX)*scale;

    },

    y:function(lat){

      return H-
        (
          offsetY+
          (lat-minY)*scale
        );

    }

  };

}


/* =========================
   SVG PATH
========================= */

function geometryToPath(
  geometry,
  project
){

  return displayRings(geometry)

    .map(function(ring){

      return ring

        .map(function(point,index){

          const x=
            project.x(point[0])
              .toFixed(2);

          const y=
            project.y(point[1])
              .toFixed(2);

          return (
            index===0
              ? "M"
              : "L"
          )+
          x+
          ","+
          y;

        })

        .join("")+
        "Z";

    })

    .join("");

}


/* =========================
   BREADCRUMB
========================= */

function renderBreadcrumb(){

  breadcrumb.innerHTML="";


  if(currentLevel==="country"){

    const current=
      document.createElement("span");

    current.className=
      "crumb-current";

    current.textContent=
      "🇦🇷 Argentina";

    breadcrumb.appendChild(current);

    return;

  }


  const argentina=
    document.createElement("button");

  argentina.className=
    "crumb-btn";

  argentina.textContent=
    "🇦🇷 Argentina";

  argentina.addEventListener(
    "click",
    showArgentina
  );

  breadcrumb.appendChild(
    argentina
  );


  const sep1=
    document.createElement("span");

  sep1.textContent="›";

  breadcrumb.appendChild(sep1);


  if(currentLevel==="province"){

    const current=
      document.createElement("span");

    current.className=
      "crumb-current";

    current.textContent=
      currentProvince.name;

    breadcrumb.appendChild(
      current
    );

    return;

  }


  const provinceButton=
    document.createElement("button");

  provinceButton.className=
    "crumb-btn";

  provinceButton.textContent=
    currentProvince.name;

  provinceButton.addEventListener(
    "click",
    function(){

      showProvince(
        currentProvince.feature
      );

    }
  );

  breadcrumb.appendChild(
    provinceButton
  );


  const sep2=
    document.createElement("span");

  sep2.textContent="›";

  breadcrumb.appendChild(sep2);


  const current=
    document.createElement("span");

  current.className=
    "crumb-current";

  current.textContent=
    currentDepartment.name;

  breadcrumb.appendChild(
    current
  );

}


/* =========================
   BOTÓN VOLVER
========================= */

function updateBackButton(){

  if(currentLevel==="country"){

    back.classList.remove(
      "visible"
    );

    return;

  }


  back.classList.add(
    "visible"
  );


  if(currentLevel==="province"){

    back.textContent=
      "← Volver a Argentina";

  }

  else if(
    currentLevel==="department"
  ){

    back.textContent=
      "← Volver a "+
      currentProvince.name;

  }

}


back.addEventListener(
  "click",
  function(){

    if(currentLevel==="province"){

      showArgentina();

      return;

    }


    if(currentLevel==="department"){

      showProvince(
        currentProvince.feature
      );

    }

  }
);


/* =========================
   DIBUJAR POLÍGONOS
========================= */

function drawFeatures(
  features,
  onClick
){

  svg.innerHTML="";

  regionElements=[];
  localityElements=[];


  const visible=
    features.filter(function(feature){

      return (
        displayRings(
          feature.geometry
        ).length>0
      );

    });


  const project=
    createProjection(visible);


  visible.forEach(function(feature){

    const name=
      featureName(feature);


    const d=
      geometryToPath(
        feature.geometry,
        project
      );


    if(!d){
      return;
    }


    const path=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    path.setAttribute(
      "d",
      d
    );

    path.setAttribute(
      "class",
      "region"
    );


    path.dataset.name=
      name;

    path.dataset.search=
      normalizeText(name);


    const tooltip=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "title"
      );

    tooltip.textContent=
      name;

    path.appendChild(
      tooltip
    );


    path.addEventListener(
      "click",
      function(){

        onClick(
          feature,
          path,
          project
        );

      }
    );


    svg.appendChild(
      path
    );

    regionElements.push(
      path
    );

  });


  return project;

}


/* =========================
   ARGENTINA
========================= */

function showArgentina(){

  currentLevel=
    "country";

  currentProvince=
    null;

  currentDepartment=
    null;


  search.value="";

  search.placeholder=
    "🔎 Buscar Radio, TV o Lugar...";


  localityList.innerHTML="";

  localityList.classList.remove(
    "visible"
  );


  title.textContent=
    "🇦🇷 Argentina";


  info.textContent=
    "Seleccioná una provincia para explorar sus departamentos y medios.";


  context.textContent=
    "Explorá radios y canales de TV de Argentina";


  tag.textContent=
    "Seleccioná una provincia";


  renderBreadcrumb();
  updateBackButton();


  drawFeatures(

    provincias.features,

    function(feature){

      showProvince(feature);

    }

  );

}


/* =========================
   PROVINCIA
========================= */

function showProvince(
  provinceFeature
){

  const provinceName=
    featureName(
      provinceFeature
    );


  const provinceId=
    String(

      prop(
        provinceFeature,
        ["id","in1"]
      )

    ).padStart(2,"0");


  currentLevel=
    "province";


  currentProvince={

    id:provinceId,
    name:provinceName,
    feature:provinceFeature

  };


  currentDepartment=
    null;


  search.value="";

  search.placeholder=
    "🔎 Buscar Radio, TV o Lugar...";


  localityList.innerHTML="";

  localityList.classList.remove(
    "visible"
  );


  const filtered=
    departamentos.features
      .filter(function(feature){

        const depId=
          String(
            prop(
              feature,
              ["id","in1"]
            )
          );

        return (
          depId.substring(0,2)
          ===
          provinceId
        );

      });


  title.textContent=
    provinceName;


  info.textContent=
    "Seleccioná un departamento para explorar sus lugares.";


  context.textContent=
    "Explorá radios y canales de TV de "+
    provinceName;


  tag.textContent=
    filtered.length+
    " departamentos";


  renderBreadcrumb();
  updateBackButton();


  if(!filtered.length){

    svg.innerHTML="";

    info.textContent=
      "No encontramos departamentos asociados a esta provincia.";

    return;

  }


  drawFeatures(

    filtered,

    function(feature){

      showDepartment(
        feature
      );

    }

  );

}


/* =========================
   LUGARES BAHRA
========================= */

function departmentPlaces(
  departmentFeature
){

  const depId=
    String(
      prop(
        departmentFeature,
        ["id","in1"]
      )
    ).trim();

  const provinceId=
    String(
      currentProvince.id
    ).trim();

  function belongsToDepartment(feature){

    const p=
      feature.properties || {};

    const placeDepartment=
      String(p.cod_depto || "").trim();

    const placeProvince=
      String(p.cod_pcia || "").trim();

    return (
      placeDepartment===depId &&
      (
        !placeProvince ||
        placeProvince===provinceId
      )
    );
  }

  const localities=
    ((localidades && localidades.features) || [])
      .filter(belongsToDepartment);

  const hamlets=
    ((parajes && parajes.features) || [])
      .filter(belongsToDepartment);

  const merged=
    localities.concat(hamlets);

  const seen=
    new Set();

  return merged.filter(function(feature){

    const name=
      normalizeText(featureName(feature));

    const coords=
      (
        feature.geometry &&
        feature.geometry.type==="Point" &&
        Array.isArray(feature.geometry.coordinates)
      )
      ? feature.geometry.coordinates
      : [];

    const lon=
      coords.length>=2
        ? Number(coords[0]).toFixed(4)
        : "";

    const lat=
      coords.length>=2
        ? Number(coords[1]).toFixed(4)
        : "";

    const key=
      depId+"|"+name+"|"+lon+"|"+lat;

    if(seen.has(key)){
      return false;
    }

    seen.add(key);
    return true;
  });
}


/* =========================
   DEPARTAMENTO
========================= */

function showDepartment(
  departmentFeature
){

  const departmentName=
    featureName(
      departmentFeature
    );


  const departmentId=
    String(

      prop(
        departmentFeature,
        ["id","in1"]
      )

    ).trim();


  currentLevel=
    "department";


  currentDepartment={

    id:departmentId,
    name:departmentName,
    feature:departmentFeature

  };


  search.value="";

  search.placeholder=
    "🔎 Buscar Radio, TV o Lugar...";


  const places=
    departmentPlaces(
      departmentFeature
    );


  title.textContent=
    departmentName;


  info.textContent=
    "Seleccioná un lugar para explorar sus radios y canales de TV.";


  context.textContent=
    "Explorá radios y canales de TV de "+
    departmentName;


  tag.textContent=
    places.length+
    (
      places.length===1
        ? " lugar"
        : " lugares"
    );


  renderBreadcrumb();
  updateBackButton();


  const project=
    drawFeatures(

      [departmentFeature],

      function(){}

    );


  drawLocalities(
    places,
    project
  );


  renderLocalityList(
    places
  );

}


/* =========================
   PUNTOS DE LUGARES
========================= */

function drawLocalities(
  features,
  project
){

  localityElements=[];


  features.forEach(
    function(feature){

      if(
        !feature.geometry ||
        feature.geometry.type!=="Point"
      ){
        return;
      }


      const coords=
        feature.geometry.coordinates;


      if(
        !Array.isArray(coords) ||
        coords.length<2
      ){
        return;
      }


      const name=
        featureName(feature);


      const circle=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );


      circle.setAttribute(
        "cx",
        project.x(coords[0])
      );


      circle.setAttribute(
        "cy",
        project.y(coords[1])
      );


      circle.setAttribute(
        "r",
        "7"
      );


      circle.setAttribute(
        "class",
        "locality"
      );


      circle.dataset.name=
        name;


      circle.dataset.search=
        normalizeText(name);


      const tooltip=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "title"
        );


      tooltip.textContent=
        name;


      circle.appendChild(
        tooltip
      );


      circle.addEventListener(
        "click",
        function(){

          selectLocality(
            feature,
            circle
          );

        }
      );


      svg.appendChild(
        circle
      );


      localityElements.push(
        circle
      );

    }
  );

}


/* =========================
   LISTA DE LUGARES
========================= */

function renderLocalityList(
  features
){

  localityList.innerHTML="";


  if(!features.length){

    localityList.classList.remove(
      "visible"
    );

    return;

  }


  const sorted=
    features.slice()
      .sort(function(a,b){

        return featureName(a)
          .localeCompare(
            featureName(b),
            "es"
          );

      });


  sorted.forEach(
    function(feature){

      const button=
        document.createElement(
          "button"
        );


      button.className=
        "locality-item";


      button.textContent=
        "📍 "+
        featureName(feature);


      button.dataset.search=
        normalizeText(
          featureName(feature)
        );


      button.addEventListener(
        "click",
        function(){

          const normalized=
            normalizeText(
              featureName(feature)
            );


          const circle=
            localityElements.find(
              function(el){

                return (
                  el.dataset.search
                  ===
                  normalized
                );

              }
            );


          selectLocality(
            feature,
            circle || null
          );

        }
      );


      localityList.appendChild(
        button
      );

    }
  );


  localityList.classList.add(
    "visible"
  );

}


/* =========================
   SELECCIONAR LUGAR
========================= */

function selectLocality(
  feature,
  circle
){

  localityElements.forEach(
    function(el){

      el.classList.remove(
        "selected"
      );

    }
  );


  document
    .querySelectorAll(
      ".locality-item"
    )
    .forEach(
      function(button){

        button.classList.remove(
          "selected"
        );

      }
    );


  if(circle){

    circle.classList.add(
      "selected"
    );

  }


  const name=
    featureName(feature);


  document
    .querySelectorAll(
      ".locality-item"
    )
    .forEach(
      function(button){

        if(
          button.dataset.search
          ===
          normalizeText(name)
        ){

          button.classList.add(
            "selected"
          );

        }

      }
    );


  title.textContent=
    name;


  info.textContent=
    "Lugar seleccionado. Aquí conectaremos automáticamente sus radios y canales de TV publicados en NubiTube.";


  context.textContent=
    "Explorá radios y canales de TV de "+
    name;


  tag.textContent=
    "Lugar seleccionado";

}


/* =========================
   BUSCADOR
========================= */

search.addEventListener(
  "input",
  function(){

    const query=
      normalizeText(
        search.value
      );


    const elements=
      currentLevel==="department"
        ? localityElements
        : regionElements;


    elements.forEach(
      function(el){

        el.classList.remove(
          "selected",
          "dimmed"
        );

      }
    );


    if(!query){

      return;

    }


    const matches=
      elements.filter(
        function(el){

          return (
            el.dataset.search
              .indexOf(query)!==-1
          );

        }
      );


    elements.forEach(
      function(el){

        if(
          matches.indexOf(el)===-1
        ){

          el.classList.add(
            "dimmed"
          );

        }

      }
    );


    if(matches.length===1){

      matches[0]
        .classList.add(
          "selected"
        );

    }

  }
);

Promise.all([

      throw new Error(

      );

  fetch(
    LOCALIDADES_URL,

  )
  .then(function(response){

    if(!response.ok){

      throw new Error(

      );

    }

    return response.json();

  }),

  fetch(

  )
  .then(function(response){

    if(!response.ok){

      throw new Error(
        "Parajes HTTP "+
        response.status
      );

    }

    return response.json();

  })

])

.then(function(data){

  departamentos=

    '</span>';
